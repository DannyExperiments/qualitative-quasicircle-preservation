name: Lean · two-arc turning obstruction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Retrieve the pinned library modules for the checked proof
        working-directory: formalization
        run: |
          lake exe cache get Mathlib.Topology.MetricSpace.Pseudo.Lemmas Mathlib.Topology.Order.Basic Mathlib.Tactic
      - name: Verify the theorem and axiom report
        working-directory: formalization
        run: |
          lake env lean -DwarningAsError=true Turning.lean > "$RUNNER_TEMP/axioms.txt"
          diff -u expected-axioms.txt "$RUNNER_TEMP/axioms.txt"
